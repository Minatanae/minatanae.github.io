<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Timeline</title>
<style>
:root{
  --bg:#f6f7f9; --dots:#d9dde3; --panel:#ffffff; --text:#16191d; --muted:#6b7380;
  --line:#c3c9d2; --border:#e2e6eb; --accent:#3b5bdb; --accent-soft:#e7ecff;
  --done:#2f9e44; --done-soft:#e6f6ea; --danger:#e03131;
  --crit:#f5b700; --crit-soft:#fff6d1; --crit-ring:rgba(245,183,0,.25); --crit-text:#9a6b00; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111317; --dots:#252a31; --panel:#1a1d23; --text:#e9ecf1; --muted:#8b93a1;
    --line:#3a414c; --border:#2b3038; --accent:#7b93ff; --accent-soft:#232b4a;
    --done:#51cf66; --done-soft:#1a2e20; --danger:#ff6b6b;
    --crit:#fcc419; --crit-soft:#3a3214; --crit-ring:rgba(252,196,25,.22); --crit-text:#ffd43b; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--text)}
.btn{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.hidden{display:none!important}

/* Home */
#home{max-width:880px;margin:0 auto;padding:48px 16px 80px}
#home h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
#home .sub{color:var(--muted);margin:0 0 28px}
.home-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:120px}
.pcard:hover{border-color:var(--accent)}
.pcard h3{margin:0;font-size:16px}
.pcard p{margin:0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .meta{margin-top:auto;color:var(--muted);font-size:12px;display:flex;gap:10px}
.progress{height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.progress i{display:block;height:100%;background:var(--done)}
.empty-home{border:1px dashed var(--line);border-radius:12px;padding:40px;text-align:center;color:var(--muted)}

/* Board */
#board{position:fixed;inset:0}
#topbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(var(--bg) 60%,transparent);pointer-events:none}
#topbar>*{pointer-events:auto}
#ptitle{border:none;background:none;text-align:left;padding:4px 8px;border-radius:8px;min-width:0}
#ptitle:hover{background:var(--panel)}
#ptitle strong{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ptitle span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw}
#topbar .spacer{flex:1}
#zoombar{position:absolute;right:16px;bottom:16px;z-index:5;display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:4px;box-shadow:var(--shadow)}
#zoombar button{border:none;background:none;width:32px;height:32px;border-radius:6px;font-size:16px}
#zoombar button:hover{background:var(--bg)}
#hint{position:absolute;left:16px;bottom:16px;z-index:5;color:var(--muted);font-size:12px}
#viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:22px 22px}
#viewport.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#lines{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
#lines line{stroke:var(--line);stroke-width:2}
#lines line.dash{stroke-dasharray:5 5}
#lines line.done{stroke:var(--done)}

.card{position:absolute;background:var(--panel);border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:4px;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card .date{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.card .date.late{color:var(--danger);font-weight:600}
.card .title{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.card .who{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden;margin-top:auto}
.chip{font-size:11px;padding:1px 7px 1px 2px;border-radius:999px;background:var(--bg);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip b{width:16px;height:16px;border-radius:50%;color:#fff;font-size:9px;display:inline-grid;place-items:center;font-weight:700}
.card.detail{padding:8px 10px;border-radius:10px}
.card.detail .title{font-weight:500;font-size:13px;-webkit-line-clamp:1}
.card.start{background:var(--accent);border-color:var(--accent);color:#fff}
.card.start .date{color:rgba(255,255,255,.8)}
.card.start .chip{background:rgba(255,255,255,.18)}
.card.done{border-color:var(--done);background:var(--done-soft)}
.card.done .title{text-decoration:line-through;text-decoration-color:var(--muted);opacity:.8}
.card.crit{border-color:var(--crit);background:var(--crit-soft);box-shadow:0 0 0 3px var(--crit-ring),var(--shadow)}
.card.start.crit{background:var(--crit-soft);color:var(--text)}
.card.start.crit .date{color:var(--muted)}
.warn{color:var(--crit-text);font-weight:700;display:inline-flex;align-items:center;gap:3px}
.crit-toggle input{accent-color:var(--crit)}
.check{width:14px;height:14px;border-radius:50%;background:var(--done);color:#fff;display:inline-grid;place-items:center;font-size:9px;font-weight:700}

.plus{position:absolute;border-radius:50%;border:1.5px dashed var(--line);background:var(--panel);color:var(--muted);display:grid;place-items:center;padding:0;line-height:1;transition:all .15s}
.plus:hover{border-style:solid;border-color:var(--accent);color:var(--accent);transform:scale(1.12)}
.plus.big{border-style:solid;border-width:2px;border-color:var(--accent);color:var(--accent);font-size:26px;box-shadow:var(--shadow)}
.plus.big:hover{background:var(--accent);color:#fff}
.plus.small{font-size:15px;opacity:.55}
.plus.small:hover{opacity:1}
.plus.inline{font-size:13px;opacity:0;border-style:solid}
.seg-hit:hover .plus.inline,.plus.inline:hover,.plus.inline:focus-visible{opacity:1}
@media (hover:none){.plus.inline{opacity:.7}.plus.small{opacity:.8}}
.seg-hit{position:absolute;height:30px}
.start-label{position:absolute;color:var(--muted);font-size:13px;text-align:center;width:200px;pointer-events:none}

/* Drawer + modal */
#scrim{position:fixed;inset:0;background:rgba(10,12,16,.35);z-index:20}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--panel);z-index:21;box-shadow:-8px 0 30px rgba(0,0,0,.15);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s ease}
#drawer.open{transform:none}
#drawer header{padding:18px 20px 6px;display:flex;align-items:center;gap:8px}
#drawer header h2{font-size:17px;margin:0;flex:1}
#drawer form{padding:8px 20px 20px;display:flex;flex-direction:column;gap:14px;overflow:auto;flex:1}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
input[type=text],input[type=date],input[type=time],textarea{border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:14px;font-weight:400;width:100%}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;min-height:90px}
.row{display:flex;gap:10px}.row>*{flex:1}
.toggle{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--text);font-weight:500}
.toggle input{width:18px;height:18px;accent-color:var(--done)}
.form-actions{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.form-actions .grow{flex:1}
.ctx{font-size:12px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px}
#modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}
#modal .box{background:var(--panel);border-radius:14px;width:min(440px,100%);padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal h2{margin:0 0 14px;font-size:18px}
#modal form{display:flex;flex-direction:column;gap:14px}
@media (max-width:600px){#hint{display:none}#topbar .lbl{display:none}}
</style>
</head>
<body>

<section id="home" class="hidden">
  <h1>Timeline</h1>
  <p class="sub">Projekt som tidslinjer. Steg åt höger, detaljer uppåt och nedåt.</p>
  <div class="home-actions">
    <button class="btn primary" id="newProject">+ Nytt projekt</button>
    <button class="btn" id="importBtn">Importera</button>
    <input type="file" id="importFile" accept="application/json,.json" class="hidden">
  </div>
  <div id="plist" class="plist"></div>
</section>

<section id="board" class="hidden">
  <div id="viewport"><div id="world"><svg id="lines"></svg><div id="nodes"></div></div></div>
  <div id="topbar">
    <button class="btn" id="backBtn" title="Alla projekt">&larr;<span class="lbl"> Projekt</span></button>
    <button id="ptitle" title="Redigera projekt"><strong></strong><span></span></button>
    <div class="spacer"></div>
    <button class="btn" id="exportBtn" title="Ladda ner som JSON">Exportera</button>
  </div>
  <div id="zoombar">
    <button id="zoomOut" title="Zooma ut">&minus;</button>
    <button id="zoomFit" title="Visa allt">&#9634;</button>
    <button id="zoomIn" title="Zooma in">+</button>
  </div>
  <div id="hint">Dra för att flytta. Ctrl/⌘ + scroll eller nyp för att zooma.</div>
</section>

<div id="scrim" class="hidden"></div>
<aside id="drawer" aria-hidden="true">
  <header><h2 id="dTitle">Steg</h2><button class="btn ghost" id="dClose" title="Stäng">&times;</button></header>
  <form id="dForm" autocomplete="off">
    <div class="ctx" id="dCtx"></div>
    <label>Namn på steget<input type="text" id="fTitle" required maxlength="140" placeholder="t.ex. Ta fram designförslag"></label>
    <label>Vem gör det?<input type="text" id="fWho" list="whoList" placeholder="Namn, separera flera med komma"></label>
    <datalist id="whoList"></datalist>
    <div class="row">
      <label>Datum<input type="date" id="fDate"></label>
      <label>Tid<input type="time" id="fTime"></label>
    </div>
    <label>Beskrivning<textarea id="fNote" placeholder="Detaljer, länkar, anteckningar"></textarea></label>
    <label class="toggle crit-toggle"><input type="checkbox" id="fCrit"> ⚠ Kritiskt</label>
    <label class="toggle"><input type="checkbox" id="fDone"> Klart</label>
    <div class="form-actions">
      <button type="button" class="btn danger" id="dDelete">Ta bort</button>
      <span class="grow"></span>
      <button type="button" class="btn" id="dCancel">Avbryt</button>
      <button type="submit" class="btn primary" id="dSave">Spara</button>
    </div>
  </form>
</aside>

<div id="modal" class="hidden">
  <div class="box">
    <h2 id="mTitle">Nytt projekt</h2>
    <form id="mForm" autocomplete="off">
      <label>Projektnamn<input type="text" id="mName" required maxlength="100"></label>
      <label>Kort beskrivning (valfri)<textarea id="mDesc" maxlength="400" style="min-height:70px"></textarea></label>
      <div class="form-actions">
        <button type="button" class="btn danger" id="mDelete">Ta bort projekt</button>
        <span class="grow"></span>
        <button type="button" class="btn" id="mCancel">Avbryt</button>
        <button type="submit" class="btn primary" id="mSave">Skapa</button>
      </div>
    </form>
  </div>
</div>

<script>
(() => {
'use strict';
const KEY = 'fallkvist.timeline.v1';
const $ = s => document.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const pad = n => String(n).padStart(2, '0');
const todayISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const nowTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;

/* ---------- storage ---------- */
let db = { projects: [] };
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) db = JSON.parse(raw); } catch(e) {}
  if (!db || !Array.isArray(db.projects)) db = { projects: [] };
}
function save(){
  const p = current(); if (p) p.updated = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) { alert('Kunde inte spara i webbläsaren.'); }
}
load();

let currentId = null;
const current = () => db.projects.find(p => p.id === currentId) || null;

/* ---------- helpers ---------- */
const MONTHS = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
function fmtDate(s){
  if (!s.date) return '';
  const [y,m,d] = s.date.split('-').map(Number);
  const thisYear = new Date().getFullYear();
  let out = `${d} ${MONTHS[m-1]}` + (y !== thisYear ? ` ${y}` : '');
  if (s.time) out += ` ${s.time}`;
  return out;
}
function lateCheck(s){
  if (!s.date || s.done) return false;
  const due = new Date(`${s.date}T${s.time || '23:59'}`);
  return due < new Date();
}
const people = s => (s.who || '').split(',').map(x => x.trim()).filter(Boolean);
function colorFor(name){
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 55% 48%)`;
}
const initials = n => n.split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase();
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

/* ---------- routing ---------- */
function route(){
  const m = location.hash.match(/^#p=(.+)$/);
  currentId = m ? decodeURIComponent(m[1]) : null;
  if (currentId && !current()) { location.hash = ''; return; }
  closeDrawer(true);
  if (current()) { $('#home').classList.add('hidden'); $('#board').classList.remove('hidden'); renderBoard(true); }
  else { $('#board').classList.add('hidden'); $('#home').classList.remove('hidden'); renderHome(); }
}
window.addEventListener('hashchange', route);

/* ---------- home ---------- */
function renderHome(){
  const list = $('#plist'); list.innerHTML = '';
  if (!db.projects.length){
    const e = el('div','empty-home'); e.style.gridColumn = '1/-1';
    e.textContent = 'Inga projekt än. Skapa ditt första med knappen ovan.';
    list.appendChild(e); return;
  }
  [...db.projects].sort((a,b) => (b.updated||0) - (a.updated||0)).forEach(p => {
    const c = el('button','pcard');
    c.appendChild(el('h3', null, p.name));
    if (p.description) c.appendChild(el('p', null, p.description));
    const total = p.steps.length + p.steps.reduce((n,s) => n + s.up.length + s.down.length, 0);
    const done = p.steps.filter(s => s.done).length + p.steps.reduce((n,s) => n + s.up.filter(d=>d.done).length + s.down.filter(d=>d.done).length, 0);
    const meta = el('div','meta');
    meta.appendChild(el('span', null, `${p.steps.length} steg`));
    if (total) meta.appendChild(el('span', null, `${done}/${total} klara`));
    if (p.updated) meta.appendChild(el('span', null, 'Ändrad ' + new Date(p.updated).toLocaleDateString('sv-SE')));
    if (total){ const pr = el('div','progress'); const i = el('i'); i.style.width = (done/total*100) + '%'; pr.appendChild(i); c.appendChild(pr); }
    c.appendChild(meta);
    c.onclick = () => { location.hash = 'p=' + encodeURIComponent(p.id); };
    list.appendChild(c);
  });
}

/* ---------- project modal ---------- */
let modalMode = 'new';
function openModal(mode){
  modalMode = mode;
  const p = current();
  $('#mTitle').textContent = mode === 'new' ? 'Nytt projekt' : 'Redigera projekt';
  $('#mSave').textContent = mode === 'new' ? 'Skapa' : 'Spara';
  $('#mDelete').classList.toggle('hidden', mode === 'new');
  $('#mName').value = mode === 'edit' ? p.name : '';
  $('#mDesc').value = mode === 'edit' ? (p.description || '') : '';
  $('#modal').classList.remove('hidden');
  setTimeout(() => $('#mName').focus(), 20);
}
const closeModal = () => $('#modal').classList.add('hidden');
$('#newProject').onclick = () => openModal('new');
$('#ptitle').onclick = () => openModal('edit');
$('#mCancel').onclick = closeModal;
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(); });
$('#mForm').onsubmit = e => {
  e.preventDefault();
  const name = $('#mName').value.trim(); if (!name) return;
  const description = $('#mDesc').value.trim();
  if (modalMode === 'new'){
    const p = { id: uid(), name, description, created: Date.now(), updated: Date.now(), steps: [] };
    db.projects.push(p); save(); closeModal();
    location.hash = 'p=' + encodeURIComponent(p.id);
  } else {
    Object.assign(current(), { name, description }); save(); closeModal(); renderBoard();
  }
};
$('#mDelete').onclick = () => {
  const p = current();
  if (!confirm(`Ta bort projektet "${p.name}"? Det går inte att ångra.`)) return;
  db.projects = db.projects.filter(x => x.id !== p.id); save(); closeModal(); location.hash = '';
};

/* ---------- import / export ---------- */
$('#exportBtn').onclick = () => {
  const p = current();
  const blob = new Blob([JSON.stringify({ app:'timeline', version:1, projects:[p] }, null, 2)], { type:'application/json' });
  const a = el('a'); a.href = URL.createObjectURL(blob);
  a.download = (p.name.replace(/[^\wåäöÅÄÖ-]+/g,'-') || 'projekt') + '.json';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const list = Array.isArray(data.projects) ? data.projects : [data];
    let n = 0;
    for (const p of list){
      if (!p || typeof p.name !== 'string' || !Array.isArray(p.steps)) continue;
      if (db.projects.some(x => x.id === p.id)) p.id = uid();
      p.steps.forEach(s => { s.up = s.up || []; s.down = s.down || []; });
      db.projects.push(p); n++;
    }
    save(); renderHome(); alert(`${n} projekt importerade.`);
  } catch(err){ alert('Filen kunde inte läsas.'); }
};

/* ---------- layout constants ---------- */
const SPACING = 290, MAIN_W = 210, MAIN_H = 92, DET_W = 186, DET_H = 76, GAP = 34;
const BIG = 52, SMALL = 26, INLINE = 22;

/* ---------- board render ---------- */
let bounds = { x0:0, y0:0, x1:0, y1:0 };
function renderBoard(fit){
  const p = current(); if (!p) return;
  $('#ptitle strong').textContent = p.name;
  $('#ptitle span').textContent = p.description || '';
  document.title = p.name + ' · Timeline';

  const nodes = $('#nodes'), svg = $('#lines');
  nodes.innerHTML = ''; svg.innerHTML = '';
  const NS = 'http://www.w3.org/2000/svg';
  const line = (x1,y1,x2,y2,cls) => { const l = document.createElementNS(NS,'line'); l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2); if (cls) l.setAttribute('class',cls); svg.appendChild(l); };
  const plus = (x,y,size,cls,title,fn) => { const b = el('button','plus '+cls,'+'); b.style.cssText = `left:${x-size/2}px;top:${y-size/2}px;width:${size}px;height:${size}px`; b.title = title; b.onclick = e => { e.stopPropagation(); fn(); }; nodes.appendChild(b); return b; };
  bounds = { x0:-150, y0:-120, x1:150, y1:120 };
  const grow = (x,y) => { bounds.x0 = Math.min(bounds.x0,x); bounds.x1 = Math.max(bounds.x1,x); bounds.y0 = Math.min(bounds.y0,y); bounds.y1 = Math.max(bounds.y1,y); };

  if (!p.steps.length){
    plus(0, 0, 72, 'big', 'Starta projektet', () => openDrawer({ mode:'new', kind:'start' }));
    const lab = el('div','start-label','Klicka för att starta projektet'); lab.style.left = '-100px'; lab.style.top = '50px'; nodes.appendChild(lab);
    if (fit) fitView(); return;
  }

  p.steps.forEach((s, i) => {
    const x = i * SPACING;
    // main card
    nodes.appendChild(card(s, x, 0, MAIN_W, MAIN_H, i === 0 ? 'start' : '', { type:'main', i }));
    grow(x - MAIN_W/2, -MAIN_H/2); grow(x + MAIN_W/2, MAIN_H/2);

    // connector to next / end plus
    if (i < p.steps.length - 1){
      const xa = x + MAIN_W/2, xb = (i+1)*SPACING - MAIN_W/2;
      line(xa, 0, xb, 0, s.done ? 'done' : '');
      const hit = el('div','seg-hit'); hit.style.cssText = `left:${xa}px;top:-15px;width:${xb-xa}px`; nodes.appendChild(hit);
      const b = plus((xa+xb)/2 - xa, 15, INLINE, 'inline', 'Lägg till steg här emellan', () => openDrawer({ mode:'new', kind:'main', at:i+1 }));
      hit.appendChild(b);
    } else {
      const xe = x + SPACING;
      line(x + MAIN_W/2, 0, xe - BIG/2, 0, 'dash');
      plus(xe, 0, BIG, 'big', 'Lägg till nästa steg', () => openDrawer({ mode:'new', kind:'main', at:i+1 }));
      grow(xe + BIG/2, 0);
    }

    // detail chains up and down
    for (const dir of ['up','down']){
      const sign = dir === 'up' ? -1 : 1;
      let cur = sign * MAIN_H/2;
      s[dir].forEach((d, di) => {
        const cy = cur + sign * (GAP + DET_H/2);
        line(x, cur, x, cy - sign*DET_H/2, d.done ? 'done' : '');
        nodes.appendChild(card(d, x, cy, DET_W, DET_H, 'detail', { type:'detail', i, dir, di }));
        grow(x - DET_W/2, cy - DET_H/2); grow(x + DET_W/2, cy + DET_H/2);
        cur = cy + sign * DET_H/2;
      });
      const py = cur + sign * (GAP - 4 + SMALL/2);
      line(x, cur, x, py - sign*SMALL/2, 'dash');
      plus(x, py, SMALL, 'small', dir === 'up' ? 'Lägg till detaljsteg (uppåt)' : 'Lägg till detaljsteg (nedåt)',
        () => openDrawer({ mode:'new', kind:'detail', i, dir }));
      grow(x, py + sign*SMALL/2);
    }
  });
  if (fit) fitView();
}

function card(s, cx, cy, w, h, cls, ref){
  const isLate = x => cls !== 'start' && lateCheck(x);
  const crit = s.critical && !s.done;
  const c = el('button', 'card ' + cls + (s.done ? ' done' : '') + (crit ? ' crit' : ''));
  c.style.cssText = `left:${cx-w/2}px;top:${cy-h/2}px;width:${w}px;height:${h}px`;
  if (ref.type === 'main' || s.date || crit){
    const d = el('div', 'date' + (isLate(s) ? ' late' : ''));
    if (crit) d.appendChild(el('span','warn','⚠ Kritiskt'));
    if (s.done) d.appendChild(el('span','check','✓'));
    if (ref.type === 'main' || s.date) d.appendChild(el('span', null, fmtDate(s) || 'Inget datum'));
    if (isLate(s) && ref.type === 'main') d.appendChild(el('span', null, 'Försenad'));
    c.appendChild(d);
  } else if (s.done){
    const d = el('div','date'); d.appendChild(el('span','check','✓')); d.appendChild(el('span',null,'Klar')); c.appendChild(d);
  }
  c.appendChild(el('div','title', s.title));
  const ppl = people(s);
  if (ppl.length){
    const w = el('div','who');
    ppl.slice(0,3).forEach(n => { const ch = el('span','chip'); const b = el('b', null, initials(n)); b.style.background = colorFor(n); ch.append(b, n); w.appendChild(ch); });
    if (ppl.length > 3) w.appendChild(el('span','chip', '+' + (ppl.length - 3)));
    c.appendChild(w);
  }
  c.title = s.note ? `${s.title}\n\n${s.note}` : s.title;
  c.onclick = e => { e.stopPropagation(); openDrawer({ mode:'edit', ...ref }); };
  return c;
}

/* ---------- pan & zoom ---------- */
const view = { x:0, y:0, s:1 };
const vp = $('#viewport'), world = $('#world');
function apply(){ world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`; }
function zoomAt(px, py, factor){
  const s = Math.min(2, Math.max(0.2, view.s * factor));
  const k = s / view.s;
  view.x = px - (px - view.x) * k; view.y = py - (py - view.y) * k; view.s = s; apply();
}
function fitView(){
  const W = vp.clientWidth, H = vp.clientHeight, pad = 80;
  const bw = bounds.x1 - bounds.x0, bh = bounds.y1 - bounds.y0;
  const want = Math.min((W - pad*2) / bw, (H - pad*2 - 40) / bh);
  view.s = Math.min(1, Math.max(0.55, want));
  // if everything doesn't fit at a readable size, show from the start instead of centering
  view.x = want < 0.55 ? Math.min(pad, W/2) - bounds.x0 * view.s : W/2 - (bounds.x0 + bw/2) * view.s;
  view.y = H/2 + 20 - (bounds.y0 + bh/2) * view.s;
  apply();
}
function ensureVisible(x, y){
  const W = vp.clientWidth, H = vp.clientHeight, m = 140;
  const sx = view.x + x * view.s, sy = view.y + y * view.s;
  if (sx > W - m) view.x -= sx - (W - m) + 120;
  if (sx < m) view.x += m - sx;
  if (sy < m) view.y += m - sy;
  if (sy > H - m) view.y -= sy - (H - m);
  apply();
}
$('#zoomIn').onclick = () => zoomAt(vp.clientWidth/2, vp.clientHeight/2, 1.2);
$('#zoomOut').onclick = () => zoomAt(vp.clientWidth/2, vp.clientHeight/2, 1/1.2);
$('#zoomFit').onclick = fitView;

vp.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
  else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
}, { passive:false });

const pointers = new Map(); let pinch = null;
vp.addEventListener('pointerdown', e => {
  if (e.target.closest('.card,.plus')) return;
  vp.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  vp.classList.add('dragging');
  if (pointers.size === 2){
    const [a,b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x-b.x, a.y-b.y) };
  }
});
vp.addEventListener('pointermove', e => {
  const prev = pointers.get(e.pointerId); if (!prev) return;
  const cur = { x:e.clientX, y:e.clientY };
  if (pointers.size === 1){ view.x += cur.x - prev.x; view.y += cur.y - prev.y; apply(); }
  pointers.set(e.pointerId, cur);
  if (pointers.size === 2 && pinch){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    zoomAt((a.x+b.x)/2, (a.y+b.y)/2, d / pinch.d); pinch.d = d;
  }
});
const up = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) vp.classList.remove('dragging'); };
vp.addEventListener('pointerup', up); vp.addEventListener('pointercancel', up);
window.addEventListener('resize', () => { if (current()) apply(); });

/* ---------- drawer ---------- */
let ctx = null;
const getItem = c => { const p = current(); const s = p.steps[c.i]; return c.type === 'detail' ? s[c.dir][c.di] : s; };
function openDrawer(c){
  ctx = c; const p = current();
  const isNew = c.mode === 'new';
  let item = isNew ? null : getItem(c);
  const now = new Date();
  // context text
  let ctxText = '';
  if (isNew && c.kind === 'start') ctxText = 'Startpunkten för projektet. Datum och tid sätts till nu.';
  else if (isNew && c.kind === 'main') ctxText = c.at >= p.steps.length ? `Nytt steg efter "${p.steps[p.steps.length-1].title}"` : `Nytt steg mellan "${p.steps[c.at-1].title}" och "${p.steps[c.at].title}"`;
  else if (isNew && c.kind === 'detail') ctxText = `Detaljsteg ${c.dir === 'up' ? 'ovanför' : 'under'} "${p.steps[c.i].title}"`;
  else if (c.type === 'detail') ctxText = `Detaljsteg till "${p.steps[c.i].title}"`;
  else ctxText = c.i === 0 ? 'Projektets startpunkt' : `Steg ${c.i + 1} av ${p.steps.length}`;
  $('#dCtx').textContent = ctxText;

  $('#dTitle').textContent = isNew ? (c.kind === 'start' ? 'Starta projekt' : c.kind === 'detail' ? 'Nytt detaljsteg' : 'Nytt steg') : 'Redigera';
  $('#fTitle').value = item ? item.title : (c.kind === 'start' ? 'Projekt startat' : '');
  $('#fWho').value = item ? (item.who || '') : '';
  $('#fDate').value = item ? (item.date || '') : (c.kind === 'start' ? todayISO(now) : '');
  $('#fTime').value = item ? (item.time || '') : (c.kind === 'start' ? nowTime(now) : '');
  $('#fNote').value = item ? (item.note || '') : '';
  $('#fDone').checked = item ? !!item.done : c.kind === 'start';
  $('#fCrit').checked = item ? !!item.critical : false;
  $('#dDelete').classList.toggle('hidden', isNew);
  $('#dSave').textContent = isNew ? 'Lägg till' : 'Spara';

  // name suggestions
  const names = new Set();
  p.steps.forEach(s => [s, ...s.up, ...s.down].forEach(x => people(x).forEach(n => names.add(n))));
  const dl = $('#whoList'); dl.innerHTML = ''; names.forEach(n => { const o = el('option'); o.value = n; dl.appendChild(o); });

  $('#scrim').classList.remove('hidden');
  $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden','false');
  setTimeout(() => { const t = $('#fTitle'); t.focus(); if (!isNew || c.kind === 'start') t.select(); }, 60);
}
function closeDrawer(silent){
  $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden','true');
  $('#scrim').classList.add('hidden'); ctx = null;
}
$('#dClose').onclick = () => closeDrawer();
$('#dCancel').onclick = () => closeDrawer();
$('#scrim').onclick = () => closeDrawer();
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (!$('#modal').classList.contains('hidden')) closeModal(); else if (ctx) closeDrawer(); }
});

$('#dForm').onsubmit = e => {
  e.preventDefault(); if (!ctx) return;
  const p = current();
  const data = {
    title: $('#fTitle').value.trim() || 'Namnlöst steg',
    who: people({ who: $('#fWho').value }).join(', '),
    date: $('#fDate').value, time: $('#fDate').value ? $('#fTime').value : '',
    note: $('#fNote').value.trim(), done: $('#fDone').checked, critical: $('#fCrit').checked
  };
  let focus = null;
  if (ctx.mode === 'new'){
    const item = { id: uid(), created: Date.now(), ...data };
    if (ctx.kind === 'start' || ctx.kind === 'main'){
      item.up = []; item.down = [];
      const at = ctx.kind === 'start' ? 0 : ctx.at;
      p.steps.splice(at, 0, item); focus = { x: at * SPACING, y: 0 };
    } else {
      p.steps[ctx.i][ctx.dir].push(item);
      const n = p.steps[ctx.i][ctx.dir].length, sign = ctx.dir === 'up' ? -1 : 1;
      focus = { x: ctx.i * SPACING, y: sign * (MAIN_H/2 + n * (GAP + DET_H) + 40) };
    }
  } else {
    Object.assign(getItem(ctx), data);
  }
  save(); closeDrawer(); renderBoard();
  if (focus) ensureVisible(focus.x + (focus.y ? 0 : SPACING/2), focus.y);
};

$('#dDelete').onclick = () => {
  if (!ctx || ctx.mode !== 'edit') return;
  const p = current();
  if (ctx.type === 'detail'){
    if (!confirm('Ta bort detaljsteget?')) return;
    p.steps[ctx.i][ctx.dir].splice(ctx.di, 1);
  } else {
    const s = p.steps[ctx.i]; const n = s.up.length + s.down.length;
    if (!confirm(n ? `Ta bort steget och dess ${n} detaljsteg?` : 'Ta bort steget?')) return;
    p.steps.splice(ctx.i, 1);
  }
  save(); closeDrawer(); renderBoard();
};

$('#backBtn').onclick = () => { location.hash = ''; };

route();
})();
</script>
