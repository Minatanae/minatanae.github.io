<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Timeline</title>
<link rel="stylesheet" href="timeline.css?v=2">
</head>
<body>

<section id="home" class="hidden">
  <h1>Timeline</h1>
  <p class="sub">Projekt som tidslinjer. Steg åt höger, detaljer staplas uppåt.</p>
  <p class="store-note" id="storeNote"></p>
  <div class="home-actions">
    <button class="btn primary" id="newProject">+ Nytt projekt</button>
    <button class="btn" id="importBtn">Importera</button>
    <input type="file" id="importFile" accept="application/json,.json" class="hidden">
  </div>
  <div id="plist" class="plist"></div>
</section>

<section id="board" class="hidden">
  <div id="printHead"><h1></h1><p></p></div>
  <div id="viewport"><div id="world"><svg id="lines"></svg><div id="nodes"></div></div></div>
  <div id="topbar">
    <button class="btn" id="backBtn" title="Alla projekt">&larr;<span class="lbl"> Projekt</span></button>
    <button id="ptitle" title="Redigera projekt"><strong></strong><span></span></button>
    <div id="summary"></div>
    <div class="spacer"></div>
    <span id="saveState" aria-live="polite"></span>
    <select id="personSel" title="Visa bara en persons steg"></select>
    <button class="btn icon" id="undoBtn" title="Ångra (Ctrl/⌘ + Z)" disabled><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4"/><path d="M3 8h9a5 5 0 0 1 0 10H9"/></svg></button>
    <button class="btn icon" id="redoBtn" title="Gör om (Ctrl/⌘ + Shift + Z)" disabled><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4l4 4-4 4"/><path d="M17 8H8a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="btn" id="printBtn" title="Skriv ut eller spara som PDF">PDF</button>
    <button class="btn" id="exportBtn" title="Ladda ner som JSON">Exportera</button>
  </div>
  <div id="ruler"><div id="rulerTrack"></div></div>
  <div id="zoombar">
    <button id="zoomOut" title="Zooma ut">&minus;</button>
    <button id="zoomFit" title="Visa allt">&#9634;</button>
    <button id="zoomIn" title="Zooma in">+</button>
  </div>
  <div id="hint">Dra ett kort för att flytta det. Dra i bakgrunden för att panorera, Ctrl/⌘ + scroll för att zooma.</div>
</section>

<div id="scrim" class="hidden"></div>
<aside id="drawer" aria-hidden="true">
  <header><h2 id="dTitle">Steg</h2><button class="btn ghost" id="dClose" title="Stäng">&times;</button></header>
  <form id="dForm" autocomplete="off">
    <div class="ctx" id="dCtx"></div>
    <label>Namn på steget<input type="text" id="fTitle" required maxlength="140" placeholder="t.ex. Ta fram designförslag"></label>
    <label>Vem gör det?<input type="text" id="fWho" list="whoList" placeholder="Namn, separera flera med komma"></label>
    <datalist id="whoList"></datalist>
    <label>Datum<input type="date" id="fDate"></label>
    <label>Beskrivning<textarea id="fNote" placeholder="Detaljer, länkar, anteckningar"></textarea></label>
    <div class="ctx warnbox hidden" id="dWarn"></div>
    <fieldset class="seg" id="typeRow"><legend>Typ</legend>
      <div class="seg-opts">
        <label><input type="radio" name="fType" value="step"><span>Steg</span></label>
        <label><input type="radio" name="fType" value="milestone"><span>Milstolpe</span></label>
        <label id="goalOpt"><input type="radio" name="fType" value="goal"><span>🏆 Mål</span></label>
      </div>
    </fieldset>
    <fieldset class="seg"><legend>Status</legend>
      <div class="seg-opts">
        <label><input type="radio" name="fStatus" value="todo"><span>Ej påbörjad</span></label>
        <label><input type="radio" name="fStatus" value="doing"><span>Pågår</span></label>
        <label><input type="radio" name="fStatus" value="done"><span>Klar</span></label>
      </div>
    </fieldset>
    <label class="toggle crit-toggle"><input type="checkbox" id="fCrit"> ⚠ Kritiskt</label>
    <div class="cl-wrap">
      <div class="cl-head">Checklista <span id="clCount"></span></div>
      <ul id="clList"></ul>
      <div class="cl-add"><input type="text" id="clNew" placeholder="Ny punkt, tryck Enter" maxlength="200"><button type="button" class="btn" id="clAddBtn">Lägg till</button></div>
    </div>
    <div class="form-actions">
      <button type="button" class="btn danger" id="dDelete">Ta bort</button>
      <span class="grow"></span>
      <button type="button" class="btn" id="dCancel">Avbryt</button>
      <button type="submit" class="btn primary" id="dSave">Spara</button>
    </div>
  </form>
</aside>

<div id="loading">Laddar projekt…</div>
<div id="fatal" class="hidden"><div class="box"><h2 id="fatalTitle">Något gick fel</h2><p id="fatalText"></p><button class="btn primary" id="fatalRetry">Försök igen</button></div></div>
<div id="dialog" class="overlay hidden"><div class="box"><p id="dlgText"></p><div class="form-actions"><span class="grow"></span><button class="btn" id="dlgNo">Avbryt</button><button class="btn primary" id="dlgYes">OK</button></div></div></div>
<div id="toast" class="hidden"></div>

<div id="modal" class="overlay hidden">
  <div class="box">
    <h2 id="mTitle">Nytt projekt</h2>
    <form id="mForm" autocomplete="off">
      <label>Projektnamn<input type="text" id="mName" required maxlength="100"></label>
      <label>Kort beskrivning (valfri)<textarea id="mDesc" maxlength="400" style="min-height:70px"></textarea></label>
      <div class="form-actions">
        <button type="button" class="btn danger" id="mDelete">Ta bort projekt</button>
        <button type="button" class="btn" id="mDup">Duplicera</button>
        <span class="grow"></span>
        <button type="button" class="btn" id="mCancel">Avbryt</button>
        <button type="submit" class="btn primary" id="mSave">Skapa</button>
      </div>
    </form>
  </div>
</div>

<script src="timeline.js?v=2"></script>
</body>
</html>
